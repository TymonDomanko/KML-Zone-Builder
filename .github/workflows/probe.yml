name: Probe boundary URLs
on:
  push:
    branches: [probe-urls]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ca-fsa-plain
        if: always()
        run: |
          curl -fsSL -o /tmp/a "https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers/lfsa000b21a_e.zip" && head -c 2 /tmp/a | grep -q PK
      - name: ca-fsa-browser-headers
        if: always()
        run: |
          curl -fsSL -o /tmp/a -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" -H "Accept: */*" -H "Accept-Language: en" "https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers/lfsa000b21a_e.zip" && head -c 2 /tmp/a | grep -q PK
      - name: ca-status-403
        if: always()
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/files-fichiers/lfsa000b21a_e.zip)" = 403
      - name: ca-arcgis-query
        if: always()
        run: |
          curl -fsSL "https://geo.statcan.gc.ca/geo_wa/rest/services/2021/Cartographic_boundary_files/MapServer/14/query?where=1%3D1&outFields=*&resultRecordCount=2&f=geojson" | grep -q Feature
      - name: ca-open-data-api
        if: always()
        run: |
          curl -fsSL "https://open.canada.ca/data/api/action/package_search?q=forward%20sortation%20area%202021%20boundary" | grep -q '"success": true'
      - name: nl-has-shp
        if: always()
        run: |
          curl -fsSL -A "Mozilla/5.0" -o /tmp/nl.zip "https://download.cbs.nl/postcode/2024-cbs_pc4_2023_v1.zip" && unzip -l /tmp/nl.zip | grep -qi '\.shp'
      - name: nl-has-gpkg
        if: always()
        run: |
          unzip -l /tmp/nl.zip | grep -qi '\.gpkg'
